; Editor defaults for an 8 GB GPU (RTX 4060) with the 25 x 25 km World Partition map (T49).
; EditorSettings is shared by all projects on a PC: a value you change in the editor is saved per user in
; %LOCALAPPDATA%\UnrealEngine\5.8\Saved\Config\WindowsEditor\EditorSettings.ini and wins over this file.
; If the viewport still opens on Epic, choose Settings > Engine Scalability Settings > High once (or type
; "scalability 2" in the console); init_unreal.py reminds you when it sees Epic.

[ScalabilityGroups]
; Editor viewport scalability: 2 = High instead of 3 = Epic. High keeps Lumen, Nanite and virtual shadow
; maps (the look stays the same style) but uses a smaller Lumen surface cache, fewer shadow pages, lower
; view distance and texture mip bias: several hundred MB less video memory than Epic.
sg.ResolutionQuality=100
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
sg.LandscapeQuality=2

[/Script/UnrealEd.EditorPerformanceSettings]
; Cap the editor viewport's internal rendering resolution at 1440 lines. Every full-screen buffer (GBuffer,
; Lumen, TSR history, shadows) scales with it, so a large or high-DPI viewport cannot eat the VRAM budget.
bOverrideMaxViewportRenderingResolution=True
MaxViewportRenderingResolution=1440
; Show the warning icon in the viewport when scalability is lowered, so nobody mistakes it for the game look.
bEnableScalabilityWarningIndicator=True

[/Script/WorldPartitionEditor.WorldPartitionEditorSettings]
; Show HLODs (built with Build > Build HLODs) for unloaded parts of the map, so the editor can show the whole
; world without loading its actors. Loading the actors is what costs memory.
bShowHLODsInEditor=True
