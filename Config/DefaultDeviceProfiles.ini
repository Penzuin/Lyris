; Editor-only console variables for an 8 GB GPU (T49). The WindowsEditor device profile is used only by the
; editor (and Play In Editor, which runs inside it); packaged and standalone games use the Windows profile,
; so the game's look is not changed by anything here. Device profile values win over scalability groups.

[WindowsEditor DeviceProfile]
; Texture streaming pool: 1500 MB, about a fifth of 8 GB, leaving room for the editor UI, Lumen, Nanite,
; virtual shadow maps and the landscape. Textures past the pool drop a mip level instead of overflowing VRAM.
+CVars=r.Streaming.PoolSize=1500
; Never let the pool grow past what the card really has free.
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
; Virtual shadow map physical page pool: 2048 pages instead of 4096 (each 128 x 128 x 32-bit), about 130 MB
; less. Shadows look the same in a normal viewport; only very large screens may show coarser distant shadows.
+CVars=r.Shadow.Virtual.MaxPhysicalPages=2048
